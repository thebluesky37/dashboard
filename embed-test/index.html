<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Embed Test — RocketLevel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f3f4f6;
      font-family: sans-serif;
      min-height: 100vh;
      padding: 48px 32px;
    }

    /* Fake page content */
    .page-content {
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .page-content h1 { font-size: 1.75rem; color: #111827; }
    .page-content p { font-size: 1rem; color: #6b7280; line-height: 1.6; }
    .placeholder-block {
      height: 120px;
      background: #e5e7eb;
      border-radius: 8px;
    }

    /* Floating chat button */
    #chat-btn {
      position: fixed;
      bottom: 28px;
      right: 28px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #111827;
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 14px 22px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      transition: background 0.2s, transform 0.15s;
      z-index: 100;
    }
    #chat-btn:hover { background: #1f2937; transform: translateY(-2px); }
    #chat-btn svg { width: 20px; height: 20px; flex-shrink: 0; }

    /* Slide-in panel */
    #chat-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 480px;
      max-width: 100vw;
      height: 100vh;
      background: #fff;
      box-shadow: -8px 0 40px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 200;
    }
    #chat-panel.open { transform: translateX(0); }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid #e5e7eb;
      flex-shrink: 0;
    }
    .panel-header span { font-weight: 600; font-size: 0.95rem; color: #111827; }
    #close-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #6b7280;
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      transition: background 0.15s;
    }
    #close-btn:hover { background: #f3f4f6; color: #111827; }
    #close-btn svg { width: 20px; height: 20px; }

    #chat-panel iframe {
      flex: 1;
      width: 100%;
      border: none;
    }

    /* Backdrop */
    #backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.25);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s;
      z-index: 150;
    }
    #backdrop.visible { opacity: 1; pointer-events: all; }
  </style>
</head>
<body>

  <!-- Fake page content -->
  <div class="page-content">
    <h1>Welcome to Our Website</h1>
    <p>This page simulates an external website. Click the button in the bottom-right corner to open the RocketLevel chat panel.</p>
    <div class="placeholder-block"></div>
    <div class="placeholder-block"></div>
  </div>

  <!-- Floating button -->
  <button id="chat-btn" onclick="openChat()">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.129.166 2.27.293 3.423.379.35.026.67.21.865.501L12 21l2.755-4.133a1.14 1.14 0 0 1 .865-.501 48.172 48.172 0 0 0 3.423-.379c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0 0 12 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018Z" />
    </svg>
    Chat with RocketLevel
  </button>

  <!-- Backdrop -->
  <div id="backdrop" onclick="closeChat()"></div>

  <!-- Slide-in panel -->
  <div id="chat-panel">
    <div class="panel-header">
      <span>RocketLevel Chat</span>
      <button id="close-btn" onclick="closeChat()" title="Close">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
    <iframe src="http://localhost:5173" title="RocketLevel Chat" loading="lazy"></iframe>
  </div>

  <script>
    function openChat() {
      document.getElementById('chat-panel').classList.add('open');
      document.getElementById('backdrop').classList.add('visible');
    }
    function closeChat() {
      document.getElementById('chat-panel').classList.remove('open');
      document.getElementById('backdrop').classList.remove('visible');
    }
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeChat(); });
  </script>

</body>
</html>
