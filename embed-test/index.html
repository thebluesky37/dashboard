<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Embed Test — RocketLevel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f3f4f6;
      font-family: sans-serif;
      min-height: 100vh;
      padding: 48px 32px;
    }

    /* Fake page content */
    .page-content {
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .page-content h1 { font-size: 1.75rem; color: #111827; }
    .page-content p { font-size: 1rem; color: #6b7280; line-height: 1.6; }
    .placeholder-block {
      height: 120px;
      background: #e5e7eb;
      border-radius: 8px;
    }

    /* User ID / API key fields */
    .field-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .field-row label { font-size: 0.9rem; color: #374151; font-weight: 500; white-space: nowrap; width: 160px; }
    .field-row input {
      flex: 1;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 0.9rem;
      outline: none;
    }
    .field-row input:focus { border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99,102,241,0.2); }
    #open-error { font-size: 0.85rem; color: #dc2626; display: none; }

    /* Floating chat button */
    #chat-btn {
      position: fixed;
      bottom: 28px;
      right: 28px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #111827;
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 14px 22px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      transition: background 0.2s, transform 0.15s;
      z-index: 100;
    }
    #chat-btn:hover { background: #1f2937; transform: translateY(-2px); }
    #chat-btn svg { width: 20px; height: 20px; flex-shrink: 0; }

    /* Slide-in panel */
    #chat-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 480px;
      max-width: 100vw;
      height: 100vh;
      background: #fff;
      box-shadow: -8px 0 40px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 200;
    }
    #chat-panel.open { transform: translateX(0); }

    #chat-panel iframe {
      flex: 1;
      width: 100%;
      border: none;
    }

    /* Backdrop */
    #backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.25);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s;
      z-index: 150;
    }
    #backdrop.visible { opacity: 1; pointer-events: all; }
  </style>
</head>
<body>

  <!-- Fake page content -->
  <div class="page-content">
    <h1>Welcome to Our Website</h1>
    <p>This page simulates an external website. Click the button in the bottom-right corner to open the RocketLevel chat panel.</p>
    <div class="field-row">
      <label for="user-id">User ID (client_id):</label>
      <input id="user-id" type="text" placeholder="e.g. user-123" value="test-user-1" />
    </div>
    <div class="field-row">
      <label for="api-key">Embed API Key:</label>
      <input id="api-key" type="text" placeholder="your EMBED_API_KEY" />
    </div>
    <div id="open-error"></div>
    <div class="placeholder-block"></div>
    <div class="placeholder-block"></div>
  </div>

  <!-- Floating button -->
  <button id="chat-btn" onclick="openChat()">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.129.166 2.27.293 3.423.379.35.026.67.21.865.501L12 21l2.755-4.133a1.14 1.14 0 0 1 .865-.501 48.172 48.172 0 0 0 3.423-.379c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0 0 12 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018Z" />
    </svg>
    Chat with RocketLevel
  </button>

  <!-- Backdrop -->
  <div id="backdrop" onclick="closeChat()"></div>

  <!-- Slide-in panel -->
  <div id="chat-panel">
    <iframe src="about:blank" title="RocketLevel Chat" loading="lazy"></iframe>
  </div>

  <script>
    async function openChat() {
      const clientId = document.getElementById('user-id').value.trim();
      const apiKey = document.getElementById('api-key').value.trim();
      const errorEl = document.getElementById('open-error');
      errorEl.style.display = 'none';

      if (!clientId || !apiKey) {
        errorEl.textContent = 'Please enter both User ID and Embed API Key.';
        errorEl.style.display = 'block';
        return;
      }

      let iframeSrc = 'http://localhost:5173/?embed=1';

      try {
        const res = await fetch('http://localhost:7377/embed-token', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + apiKey,
          },
          body: JSON.stringify({ client_id: clientId }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          errorEl.textContent = 'Failed to get embed token: ' + (err.detail || res.status);
          errorEl.style.display = 'block';
          return;
        }
        const { token } = await res.json();
        iframeSrc = 'http://localhost:5173/?embed=1&embed_token=' + encodeURIComponent(token);
      } catch (e) {
        errorEl.textContent = 'Network error calling /embed-token: ' + e.message;
        errorEl.style.display = 'block';
        return;
      }

      document.querySelector('#chat-panel iframe').src = iframeSrc;
      document.getElementById('chat-panel').classList.add('open');
      document.getElementById('backdrop').classList.add('visible');
    }
    function closeChat() {
      document.getElementById('chat-panel').classList.remove('open');
      document.getElementById('backdrop').classList.remove('visible');
    }
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeChat(); });
    window.addEventListener('message', (e) => { if (e.data?.type === 'rldashboard:close') closeChat(); });
  </script>

</body>
</html>
