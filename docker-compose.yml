version: "3.8"

networks:
  rldashboard:
    driver: bridge

volumes:
  rldashboard_dev:
  rldashboard_pg_data:
  samplesdb_data:

services:
  backend:
    build:
      context: .
      target: base
    env_file:
      - .env
    ports:
      - "7377:7377"
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      DB_SCHEMA: "${DB_SCHEMA}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS}"
      AUTH_USERNAME: "${AUTH_USERNAME}"
      AUTH_PASSWORD: "${AUTH_PASSWORD}"
      ALLOWED_FRAME_ANCESTORS: "${ALLOWED_FRAME_ANCESTORS}"
      EMBED_SECRET: "${EMBED_SECRET}"
      EMBED_API_KEY: "${EMBED_API_KEY}"
    working_dir: /home/rldashboard/backend
    command: ["bash", "-c", "python -m alembic upgrade head && python -m uvicorn rldashboard.main:app --port=7377 --host=0.0.0.0 --reload"]
    volumes:
      - rldashboard_dev:/home/.rldashboard # persist uploads and generated local files
      - ./backend/rldashboard:/home/rldashboard/backend/rldashboard
      - ./backend/alembic:/home/rldashboard/backend/alembic
      - ./backend/alembic.ini:/home/rldashboard/backend/alembic.ini
    networks:
      - rldashboard
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    env_file:
      - .env
    environment:
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASS}"
      POSTGRES_DB: "${DB_NAME}"
    ports:
      - "5432:5432"
    volumes:
      - rldashboard_pg_data:/var/lib/postgresql/data
    networks:
      - rldashboard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p ${DB_PORT} -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    ports:
      - "3306:3306"
    volumes:
      - samplesdb_data:/var/lib/mysql
      - ./samplesdb:/docker-entrypoint-initdb.d
    networks:
      - rldashboard
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/.tanstack:/app/.tanstack
    networks:
      - rldashboard

  embed-test:
    image: nginx:alpine
    ports:
      - "9000:80"
    volumes:
      - ./embed-test:/usr/share/nginx/html:ro
    networks:
      - rldashboard
