version: "3.8"

networks:
  dataline:
    driver: bridge

volumes:
  dataline_dev:
  samplesdb_data:

services:
  backend:
    build:
      context: .
      target: base
    ports:
      - "7377:7377"
    environment:
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:7377,http://0.0.0.0:7377,http://localhost:5173,http://127.0.0.1:5173}"
      AUTH_USERNAME: "${AUTH_USERNAME:-admin}"
      AUTH_PASSWORD: "${AUTH_PASSWORD:-admin}"
    working_dir: /home/dataline/backend
    command: ["bash", "-c", "python -m alembic upgrade head && python -m uvicorn dataline.main:app --port=7377 --host=0.0.0.0 --reload"]
    volumes:
      - dataline_dev:/home/.dataline # persist local sqlite db
      - ./backend/dataline:/home/dataline/backend/dataline
      - ./backend/alembic:/home/dataline/backend/alembic
    networks:
      - dataline

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-rootpassword}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-dataline}"
      MYSQL_USER: "${MYSQL_USER:-dataline}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-dataline}"
    ports:
      - "3306:3306"
    volumes:
      - samplesdb_data:/var/lib/mysql
      - ./samplesdb:/docker-entrypoint-initdb.d
    networks:
      - dataline
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    networks:
      - dataline
